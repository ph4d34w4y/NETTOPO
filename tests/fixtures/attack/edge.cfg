hostname edge
interface Gi0/0
 nameif outside
 ip address 203.0.113.2 255.255.255.0
interface Gi0/1
 nameif dmz
 ip address 10.10.0.1 255.255.255.0
interface Gi0/2
 nameif inside
 ip address 192.168.5.1 255.255.255.0
access-list outside_in extended permit tcp any host 10.10.0.80 eq 443
access-list outside_in extended deny ip any any
access-list dmz_in extended permit tcp 10.10.0.0 255.255.255.0 host 192.168.5.50 eq 3306
access-list dmz_in extended deny ip any any
access-group outside_in in interface outside
access-group dmz_in in interface dmz
