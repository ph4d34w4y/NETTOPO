set deviceconfig system hostname PA-edge
set network interface ethernet ethernet1/1 layer3 ip 203.0.113.2/24
set network interface ethernet ethernet1/2 layer3 ip 10.10.0.1/24
set zone untrust network layer3 ethernet1/1
set zone dmz network layer3 ethernet1/2
set address web-srv ip-netmask 10.10.0.80/32
set service tcp-443 protocol tcp port 443
set rulebase security rules allow-web from untrust to dmz source any destination web-srv service tcp-443 action allow
set rulebase security rules loose-any from any to any source any destination any service any action allow
set rulebase security rules deny-all from any to any source any destination any service any action deny
