hostname ie-switch
vlan 10
 name PROCESS
vlan 20
 name CONTROL
interface Vlan10
 ip address 10.1.10.1 255.255.255.0
interface Vlan20
 ip address 10.1.20.1 255.255.255.0
interface GigabitEthernet1/1
 switchport access vlan 10
interface GigabitEthernet1/2
 switchport access vlan 10
interface GigabitEthernet1/3
 switchport access vlan 20
access-list inter_vlan extended permit tcp 10.1.10.0 255.255.255.0 host 10.1.20.5 eq 502
access-list inter_vlan extended deny ip any any
access-group inter_vlan in interface Vlan10
