config system global
    set hostname "FGT-edge"
end
config system interface
    edit "wan1"
        set ip 203.0.113.5 255.255.255.0
        set allowaccess ping https ssh http
        set alias "Internet"
    next
    edit "internal"
        set ip 192.168.100.1 255.255.255.0
        set allowaccess ping https ssh telnet
        set alias "LAN"
    next
    edit "dmz"
        set ip 10.100.0.1 255.255.255.0
        set allowaccess ping https
    next
end
config system zone
    edit "trust"
        set interface "internal"
    next
    edit "untrust"
        set interface "wan1"
    next
end
config firewall policy
    edit 1
        set srcintf "internal"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "ALL"
    next
    edit 2
        set srcintf "wan1"
        set dstintf "dmz"
        set srcaddr "all"
        set dstaddr "web-server"
        set action accept
        set service "HTTPS"
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 203.0.113.1
    next
end
